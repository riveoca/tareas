name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt ruff
      - name: Revisar errores de sintaxis y nombres sin definir
        run: ruff check --select E9,F63,F7,F82 --output-format github .
      - name: Comprobar que la app importa
        run: python -c "import tareas_app.server"
